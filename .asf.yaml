# see https://s.apache.org/asfyaml
github:
  description: "Apache Maven Plugin Tools"
  homepage: https://maven.apache.org/plugin-tools/
  labels:
    - java
    - build-management
    - maven-plugins
    - maven-plugin-plugin
    - maven
    - hacktoberfest
  protected_branches:
    master: { }
    maven-plugin-tools-3.x: { }
  pull_requests:
    del_branch_on_merge: true
  enabled_merge_buttons:
    squash: true
    merge: false
    rebase: true
  features:
    issues: true
notifications:
  commits: commits@maven.apache.org
  issues: issues@maven.apache.org
  pullrequests: issues@maven.apache.org

# https://releases.apache.org/projects/maven-plugin-tools
project:
  metadata:
    key: maven-plugin-tools
    committee: maven
    name: Apache Maven Plugin Tools
    description: The Maven Plugin Tools contains the necessary tools to produce Maven Plugins in scripting languages and to generate content such as descriptor, help, and documentation.
    short_description: The Maven Plugin Tools contains the necessary tools to produce Maven Plugins in scripting languages and to generate content such as descriptor, help, and documentation.
    homepage: https://maven.apache.org/plugin-tools/
    download_page: https://maven.apache.org/plugin-tools/download.cgi
    bug_database: https://maven.apache.org/plugin-tools/issue-management.html
    mailing_lists: https://maven.apache.org/plugin-tools/mailing-lists.html
    repositories:
      - https://github.com/apache/maven-plugin-tools.git
    categories:
      - build-management
    programming_languages:
      - Java
    version_method: semver
    cycle_match: (\d+)\..*
  policy:
    github_repository_name: maven-plugin-tools
    download_path_suffix: plugins
  features:
    atr_sync: true
